name: Mission approval intake + dispatch

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  intake:
    if: >-
      github.event.sender.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[Mission]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate explicit approval envelope
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          printf '%s\n' "$BODY" | grep -q '^APPROVAL: approved$'
          printf '%s\n' "$BODY" | grep -q '^PROJECT:'
          printf '%s\n' "$BODY" | grep -q '^REPOSITORY:'
          printf '%s\n' "$BODY" | grep -Eq '^RISK_CLASS: A[0-2]$'
          printf '%s\n' "$BODY" | grep -q '^### Approved mission$'
          printf '%s\n' "$BODY" | grep -Eq 'A0[–-]A2'

      - name: Mark durable approved handoff
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh label create mission-approved --repo "$GITHUB_REPOSITORY" --color 315EFB --description "Human-approved Mission Control handoff" --force
          gh label create agent-handoff --repo "$GITHUB_REPOSITORY" --color EEF2FF --description "Validated handoff awaiting bounded runner dispatch" --force
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label mission-approved --add-label agent-handoff

      - name: Dispatch bounded worker backend
        env:
          SOURCE_TOKEN: ${{ github.token }}
          MISSION_RUNNER_TOKEN: ${{ secrets.MISSION_RUNNER_TOKEN || secrets.REPO_FACTORY_TOKEN }}
        run: node scripts/mission-dispatch.mjs
