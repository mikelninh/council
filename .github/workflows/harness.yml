name: harness-contract
on:
  push:
    branches: [main]
  pull_request:
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check scripts/harness-check.mjs
      - run: node scripts/harness-check.mjs
      - run: npm run check
      - run: npm run test:mission
      - run: npm run test:decision
      - run: npm run test:founder
