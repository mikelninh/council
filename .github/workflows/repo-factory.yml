name: Repo Factory

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  create-repository:
    if: >-
      github.event.sender.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[create-repo] ')
    runs-on: ubuntu-latest
    steps:
      - name: Create requested repository
        uses: actions/github-script@v7
        env:
          REPO_FACTORY_TOKEN: ${{ secrets.REPO_FACTORY_TOKEN }}
        with:
          github-token: ${{ github.token }}
          script: |
            const title = context.payload.issue.title;
            const body = context.payload.issue.body || '';
            const name = title.replace(/^\[create-repo\]\s*/i, '').trim();

            if (!/^[A-Za-z0-9._-]{1,100}$/.test(name)) {
              core.setFailed('Repository name must be 1–100 characters using letters, numbers, dot, underscore or hyphen.');
              return;
            }

            const settings = {};
            for (const line of body.split(/\r?\n/)) {
              const match = line.match(/^\s*([a-zA-Z_-]+)\s*:\s*(.*?)\s*$/);
              if (match) settings[match[1].toLowerCase()] = match[2];
            }

            const visibility = (settings.visibility || 'private').toLowerCase();
            if (!['public', 'private'].includes(visibility)) {
              core.setFailed('visibility must be public or private');
              return;
            }

            const token = process.env.REPO_FACTORY_TOKEN;
            if (!token) {
              core.setFailed('REPO_FACTORY_TOKEN is not configured.');
              return;
            }

            const response = await fetch('https://api.github.com/user/repos', {
              method: 'POST',
              headers: {
                'Accept': 'application/vnd.github+json',
                'Authorization': `Bearer ${token}`,
                'X-GitHub-Api-Version': '2026-03-10',
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                name,
                description: (settings.description || '').slice(0, 350),
                private: visibility === 'private',
                auto_init: true,
                has_issues: true
              })
            });

            const result = await response.json();
            if (!response.ok) {
              const message = result?.message || `GitHub API returned ${response.status}`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `❌ Repo Factory could not create **${name}**: ${message}`
              });
              core.setFailed(message);
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Created repository: ${result.html_url}`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
