name: Check Council
on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: Exercise deterministic decision-quality contract
        run: npm run test:decision
      - name: Exercise compact founder-view contract
        run: npm run test:founder

  github-tool-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exercise truthful GitHub portfolio adapter
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/github-smoke.mjs
