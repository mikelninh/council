name: Check Council
on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: Exercise deterministic decision-quality contract
        run: npm run test:decision
      - name: Exercise compact founder-view contract
        run: npm run test:founder
      - name: Exercise deterministic Mission Control state contract
        run: npm run test:mission
      - name: Protect founder-first Mission Control information architecture
        run: npm run test:mission-ui
      - name: Exercise Chief recommendation and authority contract
        run: npm run test:chief
      - name: Exercise provider-independent bounded runner contract
        run: npm run test:runner

  github-tool-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exercise truthful GitHub portfolio adapter
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/github-smoke.mjs
      - name: Build public-safe GitHub Pages snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: mikelninh
          MISSION_CONTROL_REFRESH_URL: https://github.com/mikelninh/mikelninh.github.io/actions/workflows/pages.yml
        run: npm run build:pages
      - name: Verify generated cockpit + worker artefacts
        run: |
          test -s dist-pages/mission-control/index.html
          test -s dist-pages/mission-control/mission-control.json
          test -s dist-pages/mission-control/mission-control.js
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('dist-pages/mission-control/mission-control.json','utf8'));if(d.experienceVersion!=='1.2'||d.chief?.schema!=='council-chief-v1'||!d.chief?.recommendation||d.runner?.schema!=='council-runner-summary-v1.2'||d.safety?.automaticRiskCeiling!=='A2'||d.safety?.providerIndependent!==true)process.exit(1);console.log('MISSION CONTROL v1.2 SNAPSHOT PASS:',d.chief.recommendation.project,'worker fabric',d.runner.counts);"
