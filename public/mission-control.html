<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10">
<title>Mission Control — Focus</title><meta name="description" content="A founder-first view of what matters now across Michael Ninh's public project portfolio."><link rel="stylesheet" href="./mission-control.css">
</head>
<body>
<div class="ambient"></div>
<header class="bar">
  <a class="brand" href="https://github.com/mikelninh/council" target="_blank" rel="noreferrer"><span>✦</span><b>MISSION CONTROL</b><em>v0.4 · FOCUS</em></a>
  <div class="bar-actions"><span id="syncState" class="sync-state">SYNCING</span><button id="refresh" class="icon-button" aria-label="Reload current snapshot">↻</button></div>
</header>
<main>
  <section class="intro">
    <p class="eyebrow">TODAY</p>
    <h1>What matters <i>now?</i></h1>
    <p id="statusLine" class="status-line">Reading the portfolio…</p>
  </section>

  <section id="focusCard" class="focus-card loading" aria-live="polite"></section>

  <section class="next-section">
    <header class="section-title"><div><span>NEXT UP</span><strong>After the one thing above.</strong></div><small>MAX 3</small></header>
    <div id="nextUp" class="next-list"></div>
  </section>

  <details id="portfolioDetails" class="drawer">
    <summary><div><span>Everything else</span><small id="detailsCount">Loading…</small></div><span class="chevron">⌄</span></summary>
    <div id="portfolioGroups" class="portfolio-groups"></div>
  </details>

  <details id="systemDetails" class="drawer system-drawer">
    <summary><div><span>System details</span><small>Evidence, scope and refresh state</small></div><span class="chevron">⌄</span></summary>
    <div id="systemBody" class="system-body"></div>
  </details>
</main>
<script src="./mission-control.js" defer></script>
</body></html>
