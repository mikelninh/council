<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2efe8">
<title>Mission Control — Workflow Map</title><meta name="description" content="A calm workflow map showing who owns the next move, what can continue, what is blocked and where each mission is headed."><link rel="stylesheet" href="./mission-control.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="https://github.com/mikelninh/council" target="_blank" rel="noreferrer"><span class="brand-mark">✦</span><b>Mission Control</b><small>v0.9</small></a>
  <div class="top-actions"><span id="syncState">SYNCING</span><button id="refresh" aria-label="Reload snapshot">↻</button></div>
</header>
<main>
  <section class="overview">
    <div><span class="kicker">WORKFLOW MAP</span><h1>What moves next.</h1></div>
    <div id="workflowSummary" class="workflow-summary"></div>
  </section>

  <nav id="workflowFilters" class="workflow-filters" aria-label="Filter missions by next owner">
    <button class="active" data-lane="all">ALL <b id="countAll">—</b></button>
    <button data-lane="your_move">YOUR MOVE <b id="countYou">—</b></button>
    <button data-lane="can_continue">CAN CONTINUE <b id="countContinue">—</b></button>
    <button data-lane="blocked">BLOCKED <b id="countBlocked">—</b></button>
    <button data-lane="needs_contract">NEEDS CONTRACT <b id="countContract">—</b></button>
  </nav>

  <section class="win-ticker" aria-label="Recent wins"><span>🎉 LATEST</span><div id="winTicker"></div></section>

  <section class="missions-section">
    <div class="section-title"><div><span>CORE MISSIONS</span><b id="coreCount">—</b></div><small>Roadmap = where. Workflow = who moves next.</small></div>
    <div id="coreGrid" class="mission-grid"></div>
  </section>

  <details id="otherDetails" class="drawer">
    <summary><span>Other active experiments</span><small id="otherCount">—</small><i>⌄</i></summary><div id="otherProjects" class="other-list"></div>
  </details>
  <details id="quietDetails" class="drawer">
    <summary><span>Quiet / completed</span><small id="quietCount">—</small><i>⌄</i></summary><div id="quietProjects" class="other-list"></div>
  </details>
  <details id="systemDetails" class="drawer muted-drawer">
    <summary><span>System + evidence</span><small>snapshot details</small><i>⌄</i></summary><div id="systemBody" class="system-body"></div>
  </details>
</main>
<script src="./mission-control.js" defer></script>
</body></html>
