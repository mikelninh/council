<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2efe8">
<title>Mission Control — Visual Map</title><meta name="description" content="A compact visual map of Michael Ninh's core missions, roadmap position, recent wins and next biggest wins."><link rel="stylesheet" href="./mission-control.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="https://github.com/mikelninh/council" target="_blank" rel="noreferrer"><span class="brand-mark">✦</span><b>Mission Control</b><small>v0.7</small></a>
  <div class="top-actions"><span id="syncState">SYNCING</span><button id="refresh" aria-label="Reload snapshot">↻</button></div>
</header>
<main>
  <section class="overview">
    <div><span class="kicker">PORTFOLIO MAP</span><h1>Where everything stands.</h1></div>
    <div id="portfolioPulse" class="pulse"></div>
  </section>

  <section class="wins-band" aria-labelledby="winsTitle">
    <div class="band-label"><span>🎉</span><div><b id="winsTitle">Recent wins</b><small>things worth noticing</small></div></div>
    <div id="winsStrip" class="wins-strip"></div>
  </section>

  <section class="missions-section">
    <div class="section-title"><div><span>CORE MISSIONS</span><b id="coreCount">—</b></div><small>Open a mission only when you want the full story.</small></div>
    <div id="coreGrid" class="mission-grid"></div>
  </section>

  <details id="otherDetails" class="drawer">
    <summary><span>Other active experiments</span><small id="otherCount">—</small><i>⌄</i></summary><div id="otherProjects" class="other-list"></div>
  </details>
  <details id="quietDetails" class="drawer">
    <summary><span>Quiet / completed</span><small id="quietCount">—</small><i>⌄</i></summary><div id="quietProjects" class="other-list"></div>
  </details>
  <details id="systemDetails" class="drawer muted-drawer">
    <summary><span>System + evidence</span><small>snapshot details</small><i>⌄</i></summary><div id="systemBody" class="system-body"></div>
  </details>
</main>
<script src="./mission-control.js" defer></script>
</body></html>
